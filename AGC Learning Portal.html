<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGC Learning Portal — AGC Tutorials</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2545; --gold:#C59B4E; --cream:#F9F7F2; --tan:#D1C2A5;
  --bg:#F9F7F2; --surface:#FFFFFF; --surface-2:#F2EDE2; --ink:#0B2545; --ink-soft:#3B4A61;
  --gold-text:#8A6424; --line:#D1C2A5; --btn-bg:#0B2545; --btn-ink:#F9F7F2; --plate:#F6F0E4;
  --side:#0B2545; --side-ink:#E9EDF3; --side-soft:#9FB0C6; --step-empty:#E7DFCE;
  --ok:#2F6B4F; --warn:#9A5B12;
  --display:"Lexend","Segoe UI",system-ui,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07182E; --surface:#0E2744; --surface-2:#0B213B; --ink:#F3EEE3; --ink-soft:#C3CBD8;
    --gold-text:#D9B36B; --line:#2B4466; --btn-bg:#C59B4E; --btn-ink:#0B2545;
    --side:#081C35; --side-ink:#E9EDF3; --side-soft:#8FA2BC; --step-empty:#1D3656; --ok:#7CC4A0; --warn:#E3A85A;
  }
}
:root[data-theme="dark"]{
  --bg:#07182E; --surface:#0E2744; --surface-2:#0B213B; --ink:#F3EEE3; --ink-soft:#C3CBD8;
  --gold-text:#D9B36B; --line:#2B4466; --btn-bg:#C59B4E; --btn-ink:#0B2545;
  --side:#081C35; --side-ink:#E9EDF3; --side-soft:#8FA2BC; --step-empty:#1D3656; --ok:#7CC4A0; --warn:#E3A85A;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.2;margin:0;letter-spacing:-.01em}
p{margin:0 0 .9em}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Login ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:40px 20px;position:relative;overflow:hidden}
.login::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:88px 88px;mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(circle at 50% 40%,#000 20%,transparent 75%)}
.login-card{position:relative;width:min(760px,100%)}
.login-logo{background:var(--plate);border-radius:10px;padding:10px 16px;width:max-content;margin:0 auto 28px}
.login-logo img{height:64px;width:auto}
.login h1{text-align:center;font-size:clamp(1.8rem,4vw,2.5rem);margin-bottom:8px}
.login .sub{text-align:center;color:var(--ink-soft);margin-bottom:32px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.role{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.role:hover{border-color:var(--gold);transform:translateY(-2px)}
.role b{font-family:var(--display);font-size:1.1rem}
.role span{font-size:.93rem;color:var(--ink-soft)}
.role em{font-family:var(--display);font-style:normal;font-size:.85rem;color:var(--gold-text);margin-top:6px}
.login .foot{text-align:center;font-family:var(--display);font-size:.85rem;color:var(--ink-soft);margin-top:26px}
.roles-2{grid-template-columns:repeat(2,1fr);max-width:520px;margin:0 auto}
@media (max-width:680px){.roles,.roles-2{grid-template-columns:1fr}}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding:20px 16px}
.side .logo{background:var(--plate);border-radius:8px;padding:6px 10px;margin:0 4px 26px}
.side .logo img{height:40px;width:auto}
.side nav{display:flex;flex-direction:column;gap:2px;flex:1}
.side nav a{font-family:var(--display);font-size:.95rem;text-decoration:none;color:var(--side-soft);padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
.side nav a:hover{color:var(--side-ink);background:rgba(255,255,255,.06)}
.side nav a[aria-current="page"]{color:var(--side-ink);background:rgba(197,155,78,.16);box-shadow:inset 3px 0 0 var(--gold)}
.pill{background:var(--gold);color:#0B2545;font-size:.75rem;font-weight:600;border-radius:999px;padding:1px 8px}
.who{border-top:1px solid rgba(255,255,255,.1);padding:16px 6px 0;font-family:var(--display)}
.who b{display:block;font-weight:500;font-size:.95rem}
.who span{font-size:.82rem;color:var(--side-soft)}
.who button{margin-top:12px;background:none;border:1px solid rgba(255,255,255,.2);color:var(--side-ink);border-radius:8px;padding:7px 12px;font-family:var(--display);font-size:.85rem;cursor:pointer}
.who button:hover{border-color:var(--gold)}
.topbar{display:none}
.scrim{display:none}
.side{grid-column:1;grid-row:1}
main{grid-column:2;grid-row:1}
main{padding:clamp(22px,4vw,44px) clamp(18px,4vw,48px) 60px;min-width:0}
.page{max-width:1080px}
@media (max-width:880px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  main{grid-column:1;grid-row:2}
  .side{position:fixed;inset:0 auto 0 0;width:min(280px,85%);z-index:50;transform:translateX(-100%);transition:transform .25s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(5,16,32,.5);z-index:40;display:none}
  .scrim.show{display:block}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:var(--side);color:var(--side-ink);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.25);color:var(--side-ink);border-radius:8px;padding:6px 12px;font-family:var(--display);cursor:pointer}
  .topbar b{font-family:var(--display);font-weight:500}
}

/* ---------- Page elements ---------- */
.head{margin-bottom:28px}
.head h1{font-size:clamp(1.6rem,3.4vw,2.3rem)}
.head p{color:var(--ink-soft);margin:6px 0 0;max-width:62ch}
.crumb{font-family:var(--display);font-size:.88rem;color:var(--gold-text);text-decoration:none;display:inline-block;margin-bottom:10px}
.crumb:hover{text-decoration:underline}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.card h2{font-size:1.1rem;margin-bottom:14px}
.card h3{font-size:1.05rem}
.muted{color:var(--ink-soft)}
.small{font-size:.9rem}
.label{font-family:var(--display);font-size:.85rem;color:var(--ink-soft)}
.big{font-family:var(--display);font-size:2.2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:1rem;font-weight:400;color:var(--ink-soft);letter-spacing:0}
.hero-card{background:var(--navy);color:#F3EEE3;border-color:var(--navy)}
.hero-card .label,.hero-card .muted,.hero-card .big small{color:#B9C4D4}
:root[data-theme="dark"] .hero-card{border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-card{border-color:var(--gold)}}
.bar{height:8px;background:var(--step-empty);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.hero-card .bar{background:rgba(255,255,255,.14)}
.section-title{font-family:var(--display);font-size:1.15rem;font-weight:600;margin:36px 0 14px}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.row h4{font-size:.98rem;font-weight:500}
.row .meta{font-family:var(--display);font-size:.84rem;color:var(--ink-soft)}
.tag{font-family:var(--display);font-size:.78rem;font-weight:500;border-radius:6px;padding:3px 9px;white-space:nowrap;border:1px solid var(--line);color:var(--ink-soft)}
.tag.gold{background:var(--gold);border-color:var(--gold);color:#0B2545}
.tag.ok{color:var(--ok);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.btn{font-family:var(--display);font-weight:500;font-size:.95rem;border-radius:8px;padding:10px 18px;cursor:pointer;border:2px solid transparent;text-decoration:none;display:inline-block;text-align:center}
.btn-primary{background:var(--btn-bg);color:var(--btn-ink)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:transparent;border-color:var(--gold);color:var(--ink)}
.btn-ghost:hover{background:var(--gold);color:#0B2545}
.btn-sm{padding:6px 12px;font-size:.86rem}
.linkish{font-family:var(--display);font-size:.9rem;color:var(--gold-text);text-decoration:none;font-weight:500}
.linkish:hover{text-decoration:underline}
.empty{padding:26px;text-align:center;color:var(--ink-soft);border:1px dashed var(--line);border-radius:12px}

/* Staircase progress meter (signature) */
.stairs{display:flex;align-items:flex-end;gap:3px;height:34px}
.stairs i{flex:1;min-width:6px;background:var(--step-empty);border-radius:2px 2px 0 0}
.stairs i.on{background:var(--gold)}
.hero-card .stairs i{background:rgba(255,255,255,.14)}
.hero-card .stairs i.on{background:var(--gold)}
.stairs.lg{height:56px;gap:4px}

/* Courses */
.course{display:flex;flex-direction:column;gap:10px;text-decoration:none;transition:border-color .15s}
.course:hover{border-color:var(--gold)}
.course .svc{font-family:var(--display);font-size:.82rem;color:var(--gold-text);font-weight:500}
.course h3{font-size:1.2rem}
.course .foot{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:.86rem;color:var(--ink-soft)}
.module{margin-bottom:22px}
.module h3{font-size:1rem;margin-bottom:10px;color:var(--ink-soft);font-weight:500}
.lesson{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;text-decoration:none}
.lesson:hover{border-color:var(--gold)}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem;color:#0B2545}
.check.on{background:var(--gold);border-color:var(--gold)}
.lesson b{font-family:var(--display);font-weight:500;flex:1}
.lesson span{font-family:var(--display);font-size:.84rem;color:var(--ink-soft);text-align:right;max-width:42%}
.lesson b{min-width:0}
.reader{max-width:70ch}
.reader .body p{font-size:1.06rem;line-height:1.8}
.keys{background:var(--surface-2);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;padding:16px 20px;margin:22px 0}
.keys h3{font-size:.98rem;margin-bottom:8px}
.keys ul{margin:0;padding-left:1.2em}
.keys li{margin:4px 0}
.try{border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin-bottom:26px;background:var(--surface)}
.try h3{font-size:.98rem;margin-bottom:6px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:20px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-family:var(--display);font-size:.88rem;font-weight:500}
input[type=text],input[type=email],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
@media (max-width:600px){.form-row{grid-template-columns:1fr}}

/* Quiz */
.q{margin-bottom:18px}
.q legend{font-family:var(--display);font-weight:500;margin-bottom:10px;padding:0}
.q fieldset{border:0;padding:0;margin:0}
.opt{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--gold)}
.opt input{accent-color:var(--navy)}
.opt.right{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.wrong{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.score{display:flex;align-items:center;gap:20px;margin-bottom:20px}

/* Notes */
.note{border-left:4px solid var(--gold)}
.note .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.note h3{font-size:1.05rem}
.note .next{background:var(--surface-2);border-radius:8px;padding:10px 14px;font-size:.95rem;margin-top:6px}
.note .next b{font-family:var(--display);font-weight:500}

/* Schedule */
.date{width:58px;flex:none;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 0;font-family:var(--display);background:var(--surface-2)}
.date b{display:block;font-size:1.3rem;line-height:1.1}
.date span{font-size:.75rem;color:var(--ink-soft)}
.srow{display:flex;gap:14px;align-items:center;flex:1;min-width:0}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--navy);color:#F3EEE3;font-family:var(--display);padding:12px 18px;border-radius:8px;border:1px solid var(--gold);opacity:0;transition:.25s;z-index:90;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.table-wrap{overflow-x:auto}

/* Admin */
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.g4{grid-template-columns:1fr}}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;min-width:640px}
.tbl th{font-family:var(--display);font-weight:500;font-size:.8rem;color:var(--ink-soft);text-align:left;padding:0 12px 10px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .bar{margin:4px 0 0;width:110px}
.perm{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.perm:first-child{border-top:0;padding-top:0}
.perm b{font-family:var(--display);font-weight:500;display:block}
.perm input{width:20px;height:20px;accent-color:var(--navy);flex:none}
.locked{border-left:4px solid var(--warn)}
</style>
</head>

<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dayOffset = n => { const d = new Date(); d.setDate(d.getDate()+n); return iso(d); };
const today = () => iso(new Date());
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const fmt = s => parse(s).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const fmtLong = s => parse(s).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
const fmtTime = t => { if(!t) return ""; let [h,m]=t.split(":").map(Number); const ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+pad(m)+" "+ap; };
const daysUntil = s => Math.round((parse(s) - parse(today()))/86400000);
const uid = p => p + Math.random().toString(36).slice(2,8);
function dueLabel(s){ const n=daysUntil(s); if(n<0) return {t:Math.abs(n)+" day"+(n===-1?"":"s")+" overdue",c:"warn"}; if(n===0) return {t:"Due today",c:"warn"}; if(n===1) return {t:"Due tomorrow",c:"gold"}; return {t:"Due "+fmt(s),c:""}; }
let toastT; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2000); }

        {title:"Expressions & equations",lessons:[

function stairs(done,total,lg){
  const n = Math.max(1, Math.min(total, 12)); const filled = total ? Math.round(done/total*n) : 0;
  let h=""; for(let i=0;i<n;i++){ const ht = 28 + (72*(i+1)/n); h += `<i class="${i<filled?"on":""}" style="height:${ht}%"></i>`; }
  return `<div class="stairs${lg?" lg":""}" role="img" aria-label="${done} of ${total} lessons complete">${h}</div>`;
}

const money = n => "$" + Math.round(n).toLocaleString("en-US");
function billing(s){
  const p = s.pkg, owed = Math.max(0, (p.price||0) - (p.paid||0)), rate = p.total ? (p.price||0)/p.total : 0;
  const d = owed && p.due ? daysUntil(p.due) : null;
  const status = !owed ? "Paid in full" : d===null ? "Balance due" : d<0 ? `Overdue by ${-d} day${d===-1?"":"s"}` : d===0 ? "Due today" : d===1 ? "Due tomorrow" : `Due in ${d} days`;
  return {owed, rate, d, status, urgent: owed>0 && d!==null && d<=3, availed: rate*p.used, left: rate*remaining(s)};
}
function billingCard(s){
  const p = s.pkg, b = billing(s);
  const line = (k,v) => `<div class="row"><span class="small muted">${k}</span><span class="small" style="font-family:var(--display);font-weight:500;text-align:right">${v}</span></div>`;
  return `<div class="card">
    <div class="label">Payment &amp; package</div>
    <div class="big" style="margin-top:4px">${money(b.owed)} <small>${b.owed?"balance due":"owed"}</small></div>
    <span class="tag ${!b.owed?"ok":b.urgent?"warn":"gold"}" style="display:inline-block;margin:8px 0 14px">${b.status}</span>
    <div class="list">
      ${line("Package", esc(p.name))}
      ${line("Package price", money(p.price||0))}
      ${line("Paid so far", money(p.paid||0))}
      ${b.owed?line("Payment due date", p.due?fmtLong(p.due):"Not set"):""}
      ${line("Sessions availed", `${p.used} of ${p.total} · ${money(b.availed)}`)}
      ${line("Sessions remaining", `${remaining(s)} · ${money(b.left)} value`)}
      ${line("Package valid until", p.expires?fmtLong(p.expires):"No expiry")}
    </div>
  </div>`;
}

function noteMailto(n, to){
  const s = stu(n.student); const first = s.name.split(" ")[0];
  const body = [`Hi ${s.parent.split(" ")[0]},`,"",`Here are the notes from ${first}'s session on ${fmtLong(n.date)}.`,"",
    `Service: ${n.service} · ${n.mode}`,`Focus: ${n.focus}`,"","What we worked on:",n.summary,
    ...(n.next?["","Next steps:",n.next]:[]),"",`Sessions remaining: ${remaining(s)} of ${s.pkg.total} (${s.pkg.name})`,
    ...(()=>{ const b = billing(s); return b.owed ? [`Balance due: ${money(b.owed)}${s.pkg.due?` · ${b.status.toLowerCase()} (${fmtLong(s.pkg.due)})`:""}`] : ["Package: paid in full"]; })(),
    ...(s.pkg.expires?[`Package valid until: ${fmtLong(s.pkg.expires)}`]:[]),"","Thank you,",S.tutor,"AGC Tutorials"].join("\n");
  return `mailto:${encodeURIComponent(to||s.parentEmail||"").replace(/%40/g,"@")}?subject=${encodeURIComponent(`Session notes: ${s.name} · ${fmtLong(n.date)}`)}&body=${encodeURIComponent(body)}`;

V.portal = () => {

      <div class="foot"><span>${esc(s.parent)}</span>${soon?`<span class="tag gold">${soon}</span>`:""}</div></a>`; }).join("")}</div>
  <div class="grid g2" style="margin-top:36px">${birthdayList(ss)}
    <div class="card"><h2>Profiles to complete</h2>${missing.length?`<div class="list">${missing.map(s=>{ const p=s.profile||{}; const gaps=[["birthday","birthday"],["school","school"],["parentPhone","parent phone"],["emergency","emergency contact"]].filter(([k])=>!p[k]).map(x=>x[1]);
      return `<div class="row"><div><h4><a class="linkish" style="color:inherit" href="#/profile/${s.id}">${esc(s.name)}</a></h4><div class="meta">Missing ${gaps.join(", ")}</div></div></div>`; }).join("")}</div>`:`<p class="muted" style="margin:0">Every profile is complete.</p>`}</div>
  </div>`;
};
V.profile = (id) => {
  const s = stu(id); if(!s) return V.notfound();
  return `<a class="crumb" href="#/profiles">← Student profiles</a><div class="head"><div class="label">Student profile</div><h1 style="margin-top:6px">${esc(s.name)}</h1><p>${esc(s.grade)} · Parent: ${esc(s.parent)}</p>
    ${(ME.role==="tutor"||can("viewStudents"))?`<a class="btn btn-ghost btn-sm" style="margin-top:12px" href="#/student/${s.id}">View progress</a>`:""}</div>
  <div class="grid g2">${profileCard(s)}</div>${can("editProfiles")?profileForm(s):""}`;
};
V.notfound = () => `<div class="head"><h1>Page not found</h1><p>That page doesn't exist. Use the menu to find your way back.</p></div>`;

/* ---------- navigation ---------- */
const NAV = {
  student:[["dashboard","Dashboard"],["courses","My courses"],["assignments","Assignments"],["assessments","Assessments"],["notes","Session notes"],["schedule","Schedule"]],
  parent:[["overview","Overview"],["notes","Session notes"],["schedule","Schedule"],["packages","Packages & balance"]],
  tutor:[["tdash","Dashboard"],["students","Students"],["profiles","Student profiles"],["log","Log a session"],["review","Review work"],["schedule","Schedule"],["library","Course library"]],
  admin:[["adash","Students & progress"],["profiles","Student profiles"],["schedule","Schedule"]],
  superadmin:[["portal","Portal progress"],["adash","Students & progress"],["profiles","Student profiles"],["schedule","Schedule"],["access","Admin access"]]
};
const ALLOWED = {
  student:["dashboard","courses","course","lesson","assignments","assignment","assessments","quiz","notes","schedule"],
  parent:["overview","notes","schedule","packages"],
  tutor:["tdash","students","student","profiles","profile","log","review","assignment","schedule","library","course","lesson"],
  admin:["adash","student","profiles","profile","schedule"],
  superadmin:["portal","adash","student","profiles","profile","schedule","access"]
};
// Pages the Admin only sees when the Super Admin allows it
const NEEDS = {adash:"viewStudents", student:"viewStudents", profiles:"viewProfiles", profile:"viewProfiles", schedule:"viewSchedule"};
const navFor = role => NAV[role].filter(([k]) => role!=="admin" || !NEEDS[k] || can(NEEDS[k]));
function route(){ const h = location.hash.replace(/^#\/?/,""); const [name,...args] = h.split("/"); return {name,args}; }

function renderLogin(){
  document.getElementById("root").innerHTML = `<div class="login"><div class="login-card">
    <div class="login-logo"><img src="${LOGO}" alt="AGC Tutorials — Aspire. Grow. Conquer."></div>
    <h1>AGC Learning Portal</h1><p class="sub">Lessons, session notes and progress in one place.</p>
    <div class="roles">
      <button class="role" data-act="login" data-role="student" data-student="s1"><b>Student</b><span>Take lessons, submit assignments and complete assessments.</span><em>Sign in as Maya Santos</em></button>
      <button class="role" data-act="login" data-role="parent" data-student="s1"><b>Parent</b><span>Follow progress, read session notes and track your balance.</span><em>Sign in as Ana Santos</em></button>
      <button class="role" data-act="login" data-role="tutor"><b>Tutor</b><span>Log sessions, grade work and manage your students.</span><em>Sign in as Rochelle Concepcion</em></button>
    </div>
    <div class="label" style="text-align:center;margin:26px 0 12px">Staff</div>
    <div class="roles roles-2">
      <button class="role" data-act="login" data-role="admin"><b>Admin</b><span>Oversee every student's details, progress and results.</span><em>Sign in as ${esc(ADMIN)}</em></button>
      <button class="role" data-act="login" data-role="superadmin"><b>Super Admin</b><span>See how the whole portal is doing and control what the Admin can access.</span><em>Sign in as ${esc(SUPER)}</em></button>
    </div>
    <p class="foot">Demo accounts · Changes are saved in this browser · <button data-act="reset" style="background:none;border:0;color:var(--gold-text);cursor:pointer;text-decoration:underline;font:inherit">Reset demo data</button></p>
  </div></div>`;
}
function whoLabel(){
  if(ME.role==="tutor") return {n:S.tutor,r:"Founder & Tutor"};
  if(ME.role==="admin") return {n:ADMIN,r:"Admin"};
  if(ME.role==="superadmin") return {n:SUPER,r:"Super Admin"};
  const s = stu(ME.student); return ME.role==="parent" ? {n:s.parent,r:"Parent of "+s.name.split(" ")[0]} : {n:s.name,r:"Student · "+s.grade};
}
function render(){
  if(!ME){ renderLogin(); return; }
  let {name,args} = route();
  if(!ALLOWED[ME.role]){ ME = null; saveMe(); renderLogin(); return; }
  if(!ALLOWED[ME.role].includes(name)){ name = (navFor(ME.role)[0]||NAV[ME.role][0])[0]; history.replaceState(null,"","#/"+name); args=[]; }
  const html = ME.role==="admin" && NEEDS[name] && !can(NEEDS[name]) ? V.restricted() : (V[name]||V.notfound)(...args);
  const pending = S.assignments.filter(a=>a.status==="submitted").length;
  const todo = ME.role==="student" ? assignFor(ME.student).filter(a=>a.status==="assigned").length : 0;
  const parentOf = {course:"courses",lesson:ME.role==="tutor"?"library":"courses",assignment:ME.role==="tutor"?"review":"assignments",quiz:"assessments",student:ME.role==="tutor"?"students":"adash",profile:"profiles"};
  const active = parentOf[name] || name;
  const w = whoLabel();
  document.getElementById("root").innerHTML = `<div class="app">
    <div class="topbar"><button data-act="menu" aria-controls="side" aria-expanded="false">Menu</button><b>AGC Learning Portal</b></div>
    <div class="scrim" data-act="closemenu"></div>
    <aside class="side" id="side"><div class="logo"><img src="${LOGO}" alt="AGC Tutorials"></div>
      <nav aria-label="Main">${navFor(ME.role).map(([k,l])=>{const badge=k==="review"&&pending?`<span class="pill">${pending}</span>`:k==="assignments"&&todo?`<span class="pill">${todo}</span>`:"";return `<a href="#/${k}" ${k===active?'aria-current="page"':""}>${l}${badge}</a>`}).join("")}</nav>
      <div class="who"><b>${esc(w.n)}</b><span>${esc(w.r)}</span><br><button data-act="logout">Switch account</button></div>
    </aside>
    <main><div class="page">${html}</div></main></div>`;
  document.querySelector("main").focus?.();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="login"){ ME = {role:b.dataset.role, student:b.dataset.student||null}; saveMe(); location.hash = "#/"+NAV[ME.role][0][0]; render(); }
  if(a==="logout"){ ME = null; saveMe(); location.hash = ""; render(); }
  if(a==="reset"){ S = seed(); save(); toast("Demo data reset"); }
  if(a==="menu"){ document.getElementById("side").classList.add("open"); document.querySelector(".scrim").classList.add("show"); b.setAttribute("aria-expanded","true"); }
  if(a==="closemenu"){ document.getElementById("side").classList.remove("open"); b.classList.remove("show"); }
  if(a==="complete"){ const s = currentStudent(); if(!s.done.includes(b.dataset.lid)) s.done.push(b.dataset.lid); save(); toast("Lesson complete. One step higher!");
    location.hash = b.dataset.next ? `#/lesson/${b.dataset.cid}/${b.dataset.next}` : `#/course/${b.dataset.cid}`; }
  if(a==="permdefaults"){ S.adminPerms = defaultPerms(); S.accessLog.push({date:today(),text:"Admin access reset to defaults"}); save(); toast("Admin access reset to defaults"); render(); }
  if(a==="retake"){ lastQuiz = null; render(); window.scrollTo(0,0); }
});
document.addEventListener("change", e => {
  if(e.target.id==="ls"){ const pe = document.getElementById("lpe"); if(pe) pe.value = stu(e.target.value)?.parentEmail||""; }
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if(!f) return; e.preventDefault();
  const d = Object.fromEntries(new FormData(f)); const kind = f.dataset.form;
  if(kind==="submit"){ const a = S.assignments.find(x=>x.id===f.dataset.id); a.submission=d.ans.trim(); a.status="submitted"; save(); toast("Assignment submitted"); render(); }
  if(kind==="grade"){ const a = S.assignments.find(x=>x.id===f.dataset.id); a.grade=d.grade; a.feedback=d.fb.trim(); a.status="graded"; save(); toast("Graded work returned"); location.hash="#/review"; }
  if(kind==="quiz"){ const q = S.quizzes[f.dataset.id]; const answers = q.questions.map((_,i)=>Number(d["q"+i]));
    const score = answers.filter((x,i)=>x===q.questions[i].a).length;
    S.results.push({id:uid("r"),student:ME.student,quiz:q.id,score,total:q.questions.length,date:today()}); save();
    lastQuiz = {id:q.id,answers,score}; render(); window.scrollTo(0,0); }
  if(kind==="note"){ const s = stu(d.student); const email = (d.parentEmail||"").trim(); if(email) s.parentEmail = email;
    const n = {id:uid("n"),student:d.student,date:d.date,service:d.service,mode:d.mode,focus:d.focus.trim(),summary:d.summary.trim(),next:d.next.trim()};
    S.notes.push(n); s.pkg.used = Math.min(s.pkg.total, s.pkg.used+1); save();
    const mail = d.emailParent && email;
    toast(`Note saved · ${remaining(s)} sessions left for ${s.name.split(" ")[0]}${mail?" · opening email to "+s.parent.split(" ")[0]:d.emailParent?" · add a parent email to send notes":""}`);
    location.hash = "#/student/"+s.id; if(mail) location.href = noteMailto(n, email); }
  if(kind==="perms"){ if(ME.role!=="superadmin") return;
    const changes = PERMS.filter(p => !!d[p[0]] !== !!S.adminPerms[p[0]]).map(p => (d[p[0]]?"Allowed ":"Removed ")+p[1]);
    PERMS.forEach(p => S.adminPerms[p[0]] = !!d[p[0]]);
    changes.forEach(c => S.accessLog.push({date:today(),text:c}));
    save(); toast(changes.length ? `Admin access updated · ${changes.length} change${changes.length>1?"s":""}` : "No changes"); render(); }
  if(kind==="profile"){ if(!can("editProfiles")) return; const s = stu(f.dataset.id);
    if(d.name.trim()) s.name = d.name.trim(); if(d.grade.trim()) s.grade = d.grade.trim(); if(d.parent.trim()) s.parent = d.parent.trim();
    s.parentEmail = d.parentEmail.trim();
    s.profile = {birthday:d.birthday, school:d.school.trim(), lives:d.lives.trim(), from:d.from.trim(), enrolled:d.enrolled, source:d.source, parentPhone:d.parentPhone.trim(), emergency:d.emergency.trim(), needs:d.needs.trim()};
    save(); toast("Profile saved for "+s.name.split(" ")[0]); render(); }
  if(kind==="billing"){ if(!can("editBilling")) return; const s = stu(f.dataset.id);
    Object.assign(s.pkg, {price:Math.max(0,Number(d.price)||0), paid:Math.max(0,Number(d.paid)||0), due:d.due||"", expires:d.expires||""}); save();
    const b = billing(s); toast(b.owed ? `Saved · ${money(b.owed)} balance for ${s.parent.split(" ")[0]}` : "Saved · paid in full"); render(); }
  if(kind==="assign"){ S.assignments.push({id:uid("as"),student:d.student,course:d.course,title:d.title.trim(),due:d.due,instructions:d.instructions.trim(),status:"assigned"});
    const s = stu(d.student); if(!s.courses.includes(d.course)) s.courses.push(d.course); save(); toast("Assignment sent to "+s.name.split(" ")[0]); render(); }
  if(kind==="session"){ S.sessions.push({id:uid("ss"),student:d.student,date:d.date,time:d.time,subject:d.subject.trim(),service:d.service,mode:d.mode}); save(); toast("Session scheduled"); render(); }
});
window.addEventListener("hashchange", () => { if(route().name!=="quiz") lastQuiz=null; render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
